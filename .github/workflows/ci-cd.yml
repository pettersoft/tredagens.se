name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/tredagens-web

jobs:
  test:
    name: Build & smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint PHP
        run: find src -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Build prod image
        run: docker build --target prod -t tredagens-web:ci .

      - name: Smoke test
        run: |
          set -e
          docker run -d --name smoke --read-only \
            --tmpfs /tmp --tmpfs /var/run/apache2 --tmpfs /var/lock/apache2 \
            --tmpfs /var/www/data:uid=33,gid=33 \
            --cap-drop ALL -e SITE_URL=https://tredagens.se -e CONTACT_SECRET=ci-smoke-test-secret-0123456789abcdef \
            -p 8080:8080 tredagens-web:ci
          for i in $(seq 1 20); do curl -fs http://localhost:8080/ >/dev/null && break; sleep 1; done
          for p in / /boka.php /om-oss.php /v%C3%A5r-musik.php /sitemap.xml /static/css/main.css; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8080$p")
            echo "$p -> $code"; [ "$code" = 200 ]
          done
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/template/nav.php)" = 403 ]
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/lib/stats.php)" = 403 ]
          curl -s http://localhost:8080/admin/ | grep -q 'name="password"'
          # A browser visit is recorded in the stats database.
          curl -s -o /dev/null -A 'Mozilla/5.0 (smoke test)' http://localhost:8080/boka.php
          docker exec smoke php -r '$q=(new PDO("sqlite:/var/www/data/stats.db"))->prepare("SELECT COUNT(*) FROM pageviews WHERE path = ?"); $q->execute(["/boka.php"]); exit((int)$q->fetchColumn() === 1 ? 0 : 1);'
          # Contact form: renders, issues challenges, rejects a post without a solved captcha.
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/admin/_layout.php)" = 403 ]
          curl -s http://localhost:8080/boka.php | grep -q '<altcha-widget'
          curl -s http://localhost:8080/altcha-challenge.php | grep -q '"keySignature"'
          token=$(curl -s http://localhost:8080/boka.php | grep -o 'name="token" value="[^"]*"' | cut -d'"' -f4)
          sleep 4
          curl -s -d "token=$token" -d name=Test -d phone=0701234567 -d 'message=Hej, vill boka er' \
            http://localhost:8080/boka.php | grep -q 'inte är en robot'
          curl -s http://localhost:8080/ | grep -q '"https://tredagens.se/static/img/bg3-16x9.JPG"'

      - name: Container logs
        if: always()
        run: docker logs smoke || true

  build-and-push:
    name: Build & push image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            touch .env
            grep -q '^IMAGE_TAG=' .env || echo 'IMAGE_TAG=latest' >> .env
            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${{ needs.build-and-push.outputs.image_tag }}/" .env
            docker compose -f docker-compose.prod.yml --env-file .env pull
            docker compose -f docker-compose.prod.yml --env-file .env up -d --remove-orphans
            docker image prune -f
