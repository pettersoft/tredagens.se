# Production on the VPS. The shared Caddy (brfking2/deploy/caddy) reaches this
# container as tredagens-web:8080 over the external "proxy" network; no host
# ports are published.
services:
  web:
    image: ghcr.io/${GHCR_OWNER:-pettersoft}/${IMAGE_NAME:-tredagens-web}:${IMAGE_TAG:-latest}
    container_name: tredagens-web
    restart: unless-stopped
    environment:
      SITE_URL: https://tredagens.se
      # Set in .env on the server, in single quotes (see README).
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      # Signs contact form tokens and ALTCHA challenges. At least 32 characters.
      CONTACT_SECRET: ${CONTACT_SECRET:-}
    volumes:
      - stats-data:/var/www/data
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/apache2
      - /var/lock/apache2
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - proxy

volumes:
  stats-data:
    name: tredagens-stats

networks:
  proxy:
    external: true
