# Production on the VPS. The shared Caddy (brfking2/deploy/caddy) reaches this
# container as tredagens-web:8080 over the external "proxy" network; no host
# ports are published.
services:
  web:
    image: ghcr.io/${GHCR_OWNER:-pettersoft}/${IMAGE_NAME:-tredagens-web}:${IMAGE_TAG:-latest}
    container_name: tredagens-web
    restart: unless-stopped
    environment:
      SITE_URL: https://tredagens.se
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/apache2
      - /var/lock/apache2
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - proxy

networks:
  proxy:
    external: true
