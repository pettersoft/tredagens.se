# Local development: http://localhost:8090 (xdebug on port 9003).
#   docker compose up --build
services:
  web:
    build:
      context: .
      target: dev
    container_name: tredagens-dev
    ports:
      - "8090:8080"
    volumes:
      - ./src:/var/www/html
    extra_hosts:
      - "host.docker.internal:host-gateway"
